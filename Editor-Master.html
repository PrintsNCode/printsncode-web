<style>.studio-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.studio-quick button{font:600 12px system-ui;min-height:36px;padding:6px 10px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.studio-quick button:hover{background:var(--panel3)}
.studio-quick{display:block;position:sticky;top:-8px;z-index:12;background:var(--panel,#131518);padding:8px 0 12px;box-shadow:0 8px 12px -10px #0008}
.studio-category-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px}.studio-category-head .studio-up{font-size:11px;min-height:32px;border:0;background:transparent;padding:4px 8px}
.studio-category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.studio-category-grid button{min-width:0;padding:6px 4px;font-size:11px}.studio-category-grid button[aria-pressed=true]{background:#293340;border-color:#82bbff;color:#f6f8fb}
.studio-order{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.studio-order span{font-size:13px;overflow-wrap:anywhere}.studio-order>div{display:flex;gap:6px;flex-shrink:0}
.studio-pet-thumb{height:150px;overflow:auto;background:var(--panel);border-radius:8px}.studio-pet-thumb .thumb{width:120px;height:145px}.studio-pet-thumb img{width:100%;height:auto;object-fit:contain}
button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #82bbff;outline-offset:3px}
.top .brand{min-width:0}.top .brand span{white-space:normal}#panels{scroll-padding-top:12px}#panels .row,#panels .row3{min-width:0}#panels .field{min-width:0}#panels label{overflow-wrap:anywhere}
.btn.primary,.mnav .add{background:#bd1620;border-color:#bd1620;color:#fff}.btn.primary:hover,.mnav .add:hover{background:#a5101a}
@media(max-width:900px){.studio-quick{gap:6px}.studio-quick button{min-height:44px;font-size:12px}.studio-category-head .studio-up{font-size:11px;min-height:36px}.studio-order{flex-wrap:wrap}.studio-order button{min-height:44px}.top .brand{max-width:50vw;font-size:14px}.top .brand span{font-size:10px}#panels input,#panels select,#panels textarea{max-width:100%}.row3{grid-template-columns:minmax(0,1fr)!important}.acts{flex-wrap:wrap}.wxd-b,.dbody{overscroll-behavior:contain}.side-head{gap:6px}.mnav button:focus-visible{outline-offset:-4px}}

</style>

<body>
<header class="top">
  <div class="brand">Web Studio<span>PrintsNCode · Web y Link · Público</span></div>
  <div class="pages" role="tablist" aria-label="Página que editas">
    <button type="button" data-page="site" aria-pressed="true">Web principal</button>
    <button type="button" data-page="link" aria-pressed="false">Link</button>
  </div>
  <div class="spacer"></div>
  <div class="hist">
    <button class="btn" id="undo" title="Deshacer el último cambio (Ctrl/Cmd+Z)" disabled>↶ Atrás</button>
    <div class="menu" id="histMenu"><button class="btn icon" id="histBtn" title="Historial de cambios">⋯</button><div class="menu-pop hist-pop" id="histPop"></div></div>
    <button class="btn" id="redo" title="Volver a aplicar el cambio (Ctrl/Cmd+Shift+Z)" disabled>Adelante ↷</button>
  </div>
  <button class="btn" id="compareBtn" title="Mantén pulsado (o pulsa) para ver cómo estaba antes del último cambio" disabled>◑ Antes / después</button>
  <div class="menu" id="restoreMenu">
    <button class="btn" id="restoreBtn" title="Volver a los datos de ejemplo originales">⟲ Restaurar ▾</button>
    <div class="menu-pop">
      <button data-restore="page"><b id="restorePageLabel">Restaurar esta página</b><small>Vuelve a los datos de ejemplo originales solo aquí</small></button>
      <button data-restore="site"><b>Restaurar la web principal</b><small>index.html vuelve al ejemplo original</small></button>
      <button data-restore="link"><b>Restaurar la página Link</b><small>link/index.html vuelve al ejemplo original</small></button>
      <hr>
      <button data-restore="all"><b>Restaurar todo</b><small>Web + Link + imágenes del ejemplo. Se puede deshacer con «Atrás».</small></button>
    </div>
  </div>
  <button class="btn" id="importBtn" title="Cargar index.html, link/index.html o un proyecto .json">Importar</button>
  <div class="menu" id="exportMenu">
    <button class="btn primary" id="exportBtn">Exportar ▾</button>
    <div class="menu-pop">
      <button data-exp="site"><b>index.html</b><small>Web principal lista para publicar</small></button>
      <button data-exp="link"><b>link/index.html</b><small>Página de enlaces preparada para la carpeta link</small></button>
      <button data-exp="json"><b>proyecto.json</b><small>Copia completa para volver a editar</small></button>
      <hr>
      <button data-exp="folder"><b>Guardar todo en una carpeta…</b><small>Escribe los tres archivos a la vez (Chrome/Edge)</small></button>
      <button data-exp="all"><b>Descargar los tres archivos</b><small>index.html + link-index.html + proyecto.json</small></button>
    </div>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="side-head">
      <input id="search" type="search" placeholder="Buscar ajuste… (logo, fondo, intro…)" aria-label="Buscar ajuste">
      <div class="seg" id="localeSeg" title="Idioma de los textos que editas">
        <button type="button" data-loc="es" aria-pressed="true">ES</button>
        <button type="button" data-loc="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div id="panels"></div>
  </aside>
  <main class="preview">
    <div class="pbar">
      <div class="seg" id="deviceSeg">
        <button type="button" data-dev="desktop" aria-pressed="true">Escritorio</button>
        <button type="button" data-dev="tablet" aria-pressed="false">Tablet</button>
        <button type="button" data-dev="mobile" aria-pressed="false">Móvil</button>
      </div>
      <div class="seg" id="themeSeg" title="Tema de la vista previa">
        <button type="button" data-th="light" aria-pressed="true">☀ Claro</button>
        <button type="button" data-th="dark" aria-pressed="false">☾ Oscuro</button>
      </div>
      <div class="seg" id="modeSeg" title="Editar al hacer clic o navegar por la página">
        <button type="button" data-mode="edit" aria-pressed="true">✎ Editar</button>
        <button type="button" data-mode="nav" aria-pressed="false">↗ Navegar</button>
      </div>
      <button class="sbtn" id="playIntro" type="button">▶ Ver intro</button>
      <span class="status" id="status" role="status">Preparando…</span>
    </div>
    <div class="stage" id="stage"><div class="framebox" id="framebox"><iframe id="fa" class="on" title="Vista previa"></iframe><iframe id="fb" title="Vista previa (carga)"></iframe></div></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="cmpbadge" id="cmpBadge">Viendo <b>ANTES</b> del cambio · suelta o pulsa de nuevo para volver</div>
<input type="file" id="fileImport" accept=".html,.htm,.json,text/html,application/json" multiple hidden>
<input type="file" id="fileImage" accept="image/*,video/mp4,video/webm,video/quicktime" hidden>
<input type="file" id="fileFont" accept=".woff2,.woff,.ttf,.otf" hidden>

    if (kind !== 'scroll') return '';
    const w = Number(width) || 0;
    if (w > 0) return ` style="max-width:${Math.max(15, Math.min(100, w))}%"`;
    return ` style="max-width:min(100%, calc(${n + 1} * (${itemW} + ${gap})))"`;
  }
  const MOTION_CSS = `@keyframes web-ticker{from{margin-left:100%;transform:translateX(0)}to{margin-left:0;transform:translateX(-100%)}}.partner-track.web-rev{animation-direction:reverse!important}`
    + `.partner-track.web-float .partner-logo-frame{will-change:transform,opacity;transform-origin:50% 60%}`
    + `@keyframes web-float{from{transform:translateY(calc(var(--web-amp,6px) * -1))}to{transform:translateY(var(--web-amp,6px))}}.web-fx-float .partner-logo-frame{animation:web-float var(--web-float-dur,4s) ease-in-out infinite alternate;animation-delay:calc(var(--i,0) * var(--web-float-dur,4s) * -.37)}`
    + `.web-fx-wave .partner-logo-frame{animation:web-float calc(var(--web-float-dur,4s) * .6) ease-in-out infinite alternate;animation-delay:calc(var(--i,0) * var(--web-step,1s) * -.35)}`
    + `@keyframes web-pulse{0%,60%,100%{transform:scale(1)}30%{transform:scale(var(--web-scale,1.1))}}.web-fx-pulse .partner-logo-frame{animation:web-pulse calc(var(--n,4) * var(--web-step,1s)) ease-in-out infinite;animation-delay:calc(var(--i,0) * var(--web-step,1s))}`
    + `@keyframes web-swing{from{transform:rotate(calc(var(--web-deg,4deg) * -1))}to{transform:rotate(var(--web-deg,4deg))}}.web-fx-swing .partner-logo-frame{animation:web-swing var(--web-float-dur,4s) ease-in-out infinite alternate;animation-delay:calc(var(--i,0) * var(--web-step,1s) * -.5)}`
    + `@keyframes web-tilt{0%,100%{transform:perspective(500px) rotateY(0)}50%{transform:perspective(500px) rotateY(calc(var(--web-deg,4deg) * 4))}}.web-fx-tilt .partner-logo-frame{animation:web-tilt calc(var(--web-float-dur,4s) * 1.4) ease-in-out infinite;animation-delay:calc(var(--i,0) * var(--web-step,1s) * -.6)}`
    + `@keyframes web-spot{0%{opacity:.28;transform:scale(.96)}6%,16%{opacity:1;transform:scale(var(--web-scale,1.06))}26%,100%{opacity:.28;transform:scale(.96)}}.web-fx-spotlight .partner-logo-frame{opacity:.28;animation:web-spot calc(max(var(--n,4), 3) * var(--web-step,1s) * 1.4) ease-in-out infinite;animation-delay:calc(var(--i,0) * var(--web-step,1s) * 1.4)}`
    + `@keyframes web-fade{0%{opacity:0;transform:translateY(var(--web-amp,8px))}12%,72%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(calc(var(--web-amp,8px) * -.6))}}.web-fx-fade .partner-logo-frame{opacity:0;animation:web-fade calc(var(--n,4) * var(--web-step,1s) * .5 + 5s) ease-in-out infinite both;animation-delay:calc(var(--i,0) * var(--web-step,1s) * .5)}`
    + `@media(prefers-reduced-motion:reduce){.partner-track.web-ticker,.partner-track.web-float .partner-logo-frame{animation:none!important;margin-left:0!important;opacity:1!important;transform:none!important}}`;
  function partnerItemsMarkup(items, c, L, forLink, base = 'site.collaborators.items', noClones = false) {
    const imgStyle = forLink ? '' : ' data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent"';
    const one = (p, i, idx, clone) => {
      const name = p.name || '';
      const inner = p.logo ? `<span class="partner-logo-frame"><img alt="${esc(name)}" loading="lazy" decoding="async"${imgStyle} data-web-src="${c.src(p.logo)}"${c.e(base + '.' + idx + '.logo')}/></span>` : `<span class="partner-placeholder"><i></i>${esc(name || (L === 'en' ? 'Logo pending' : 'Logo pendiente'))}</span>`;
      const badge = p.affiliate ? `<small class="web-affiliate-label">${commissionLabel(L)}</small>` : '';
      const link = p.href ? `<a class="partner-link"${popupAttr(p,L)} aria-label="${esc(name)}" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer${p.affiliate ? ' sponsored' : ''}"${clone ? ' tabindex="-1"' : ''}>${inner}${badge}</a>` : `<span class="partner-link"${popupAttr(p,L)} tabindex="${clone ? '-1' : '0'}" aria-label="${esc(name)}">${inner}</span>`;
      return `<div class="partner-item partner-item--${i % 4}" style="--i:${i}" aria-hidden="${clone ? 'true' : 'false'}"${clone && forLink ? ' data-web-clone="true"' : ''}${c.it(base + '.' + idx)}>${link}</div>`;
    };
    const vis = visible(items);
    let out = vis.map(([p, idx], i) => one(p, i, idx, false)).join('');
    if (!forLink && !noClones && vis.length) out += vis.map(([p, idx], i) => one(p, i, idx, true)).join('');
    return out;
  }

  function siteTemplate(S, L, c) {
    const U = WEB_TPL.uiCopy[L] || WEB_TPL.uiCopy.es;
    const B = S.brand, locs = S.i18n.locales;
    const homeLabel = tx(B.homeLabel, L) || 'Estudio Demo';
    const lockup = (extra, loading) => `<span class="brand-lockup${extra}" aria-hidden="true">${B.mark ? `<img alt="" loading="${loading}" width="128" height="108" decoding="async" data-nimg="1" class="brand-lockup__mark" style="color:transparent" data-web-src="${c.src(B.mark)}"${c.e('site.brand.mark')}/>` : ''}${B.wordmark ? `<img alt="" loading="${loading}" width="480" height="39" decoding="async" data-nimg="1" class="brand-lockup__wordmark" style="color:transparent" data-web-src="${c.src(B.wordmark)}"${c.e('site.brand.wordmark')}/>` : ''}</span>`;
    const nav = visible(S.nav.items).filter(([n])=>n.position!=='bottom').map(([n, i], k) => {
      const t = n.target || '#';
      const ext = n.newTab || /^https?:/i.test(t);
      return `<a${k === 0 ? ' aria-current="page"' : ''} href="${esc(t)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}${c.t('site.nav.items.' + i + '.label')}${c.it('site.nav.items.' + i)}>${esc(tx(n.label, L))}</a>`;
    }).join('');
    const langNames = { es: ['Español', 'ES'], en: ['English', 'EN'] };
    const switcher = locs.length > 1 && S.i18n.switcher !== false ? `<div class="language-switcher" role="group" aria-label="${esc(U.nav.language)}">${locs.map((l) => `<a aria-label="${langNames[l][0]}"${l === L ? ' aria-current="true"' : ''} href="/${l}/" data-locale="${l}">${langNames[l][1]}</a>`).join('')}</div>` : '';
    const toggle = S.theme.allowToggle === false ? '' : `<button class="theme-toggle" type="button" aria-label="${esc(U.nav.switchToDark)}" title="${esc(U.nav.switchToDark)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.6 8.6 0 0 1 8.9 3.6a8.7 8.7 0 1 0 11.5 11.5Z"></path></svg></button>`;
    const header = `<header class="site-header"${c.e('site.nav')}><a class="skip-link" href="#contenido">${esc(U.nav.skipToContent)}</a><a class="brand-link" aria-label="${esc(homeLabel)}" href="/${L}/">${lockup('', 'eager')}</a><nav id="mobile-site-navigation" class="site-nav " aria-label="${esc(U.nav.navigation)}">${nav}</nav><div class="header-controls">${switcher}${toggle}</div><button class="menu-toggle" aria-label="${esc(U.nav.openMenu)}" aria-expanded="false" aria-controls="mobile-site-navigation"><span></span><span></span></button></header>`;

    const sections = [];
    (S.order || []).forEach((key) => {
      if (key === 'projects' && S.projects.visible !== false) sections.push(projectsSection(S, L, c, U));
      else if (key === 'about' && S.about.visible !== false) sections.push(aboutSection(S, L, c));
      else if (key === 'collaborators' && S.collaborators.visible !== false) sections.push(collabSection(S, L, c));
      else {
        const idx = (S.custom || []).findIndex((x) => x.id === key);

      }
    });

    const legal = S.footer.legalLinks === false ? '' : `<nav class="footer-links" aria-label="${L === 'en' ? 'Legal information' : 'Información legal'}"${c.e('site.legal')}><a href="${L === 'es' ? '' : '/' + L}/${esc(S.legal.slugs?.[L]?.legalNotice || (L === 'en' ? 'legal-notice' : 'aviso-legal'))}/">${esc(tx(S.legal.legalNotice.title, L))}</a><a href="${L === 'es' ? '' : '/' + L}/${esc(S.legal.slugs?.[L]?.privacy || (L === 'en' ? 'privacy' : 'privacidad'))}/">${esc(tx(S.legal.privacy.title, L))}</a>${legalExtras(S,L)}</nav>`;
    const socials = visible(S.footer.socials).map(([s, i]) => socialLink(s, i, c, L, 'site', 'site.footer.socials')).join('');
    const footer = `<footer class="site-footer" id="contacto"><div class="footer-main"><a class="footer-brand" aria-label="${esc(homeLabel)}" href="/${L}/">${lockup(' brand-lockup--footer', 'lazy')}</a>${studioSiteFooterNav(S,L)?'<div style="display:grid;gap:14px">'+legal+studioSiteFooterNav(S,L)+'</div>':legal}<nav class="footer-socials" aria-label="${L === 'en' ? 'Contact' : 'Contacto'}"${c.e('site.footer.socials')}>${socials}</nav></div><div class="footer-meta"><span${c.t('site.footer.copyright')}>${esc(tx(S.footer.copyright, L).replace('{year}', year()))}</span>${S.footer.metaBrand === false ? '' : `<span${c.e('site.brand.text')}>${brandText(B.text)}</span>`}</div></footer>`;
    const F = S.features || {};
    return `<template id="web-${L}"><div lang="${L}" data-locale="${L}">${WEBX.announceHtml(F, L, c, 'site.features')}${header}<main id="contenido">${sections.join('')}</main>${footer}${WEBX.bottomBarHtml(F, L, c, 'site.features')}${WEBX.extrasHtml(F)}${WEBX.cookieHtml(F, L)}</div></template>`;
  }

  function projectStats(p, L, c, base) {
    const stats = p.stats || defaultProjectStats();
    if (stats.visible === false) return '';
    const items = PROJECT_METRICS.filter(([key]) => stats.metrics?.[key]?.visible !== false);
    if (!items.length) return '';
    return `<div class="project-stats" data-stats-labels="${stats.showLabels !== false}" style="--stats-columns:${items.length}"${c.e(base + '.stats')}>${items.map(([key, es, en, icon]) => {
      const m = stats.metrics?.[key] || { value: '0', label: { es, en } };
      const label = tx(m.label, L), value = String(m.value ?? '0');
      return `<div class="project-stat" data-stat="${key}" aria-label="${esc(label + ': ' + value)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg><strong${c.t(base + '.stats.metrics.' + key + '.value')}>${esc(value)}</strong><span class="project-stat-label${stats.showLabels === false ? ' sr-only' : ''}"${c.t(base + '.stats.metrics.' + key + '.label')}>${esc(label)}</span></div>`;
    }).join('')}</div>`;
  }

  function projectsSection(S, L, c, U) {
    const P = S.projects;
    const vis = visible(P.items);
    const total = vis.length;
    const cards = vis.map(([p, idx], k) => {
      const base = `site.projects.items.${idx}`;
      const alt = tx(p.alt, L), aria = tx(p.aria, L) || alt;
      const img = p.img ? `<img alt="${esc(alt)}" loading="${k < 2 ? 'eager' : 'lazy'}" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent" data-web-src="${c.src(p.img)}"${c.e(base + '.img')}/>` : `<span class="project-card__placeholder"${c.e(base + '.img')}>${L === 'en' ? 'Image pending' : 'Imagen pendiente'}</span>`;
      const isVideo=(c.url(p.img)||'').startsWith('data:video/');
      const content=isVideo?`<video class="studio-project-video" src="${esc(c.url(p.img))}" controls playsinline preload="metadata" aria-label="${esc(alt)}" style="position:absolute;width:100%;height:100%;object-fit:contain"></video>`:img;
      const inner = isVideo ? `<div class="project-card__image">${content}${p.href?`<a class="studio-video-link" href="${esc(p.href)}" target="_blank" rel="noopener noreferrer" style="position:absolute;right:12px;bottom:12px;background:#111d;color:#fff;padding:8px 12px;z-index:2">${L==='en'?'Open project':'Ver proyecto'}</a>`:''}</div>` : p.href ? `<a class="project-card__image project-card__image--linked"${popupAttr(p,L)} href="${esc(p.href)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(aria)}">${content}</a>` : `<div class="project-card__image"${popupAttr(p,L)} tabindex="0">${content}</div>`;
      const stats = projectStats(p, L, c, base);
      return `<article id="project-${k + 1}" class="project-card${stats ? ' project-card--stats' : ''}"${c.it(base)}>${inner}${stats}</article>`;
    }).join('');
    const pos = U.projects.position.replace('{position}', 1).replace('{total}', total);
    const dots = vis.map((_, k) => `<button aria-label="${esc(U.projects.goTo.replace('{position}', k + 1))}"${k === 0 ? ' aria-current="true"' : ''}><span></span></button>`).join('');
    const controls = `<div class="deck-controls"${total < 2 ? ' style="display:none"' : ''}><button class="deck-arrow" aria-label="${esc(U.projects.previous)}"><span aria-hidden="true">←</span></button><div class="deck-pagination" role="group" aria-label="${L === 'en' ? 'Select project' : 'Seleccionar proyecto'}">${dots}</div><button class="deck-arrow" aria-label="${esc(U.projects.next)}"><span aria-hidden="true">→</span></button>${S.motion.autoplay === false ? '' : `<button class="deck-autoplay" aria-label="${esc(U.projects.pause)}" aria-pressed="false"><span class="pause-glyph" aria-hidden="true"></span></button>`}</div>`;
    const sub = tx(P.subtitle, L);
    return `<section class="section projects-section" id="proyectos" aria-labelledby="projects-heading"><div class="section-head projects-heading"><div><h1 id="projects-heading"${c.t('site.projects.title')}>${esc(tx(P.title, L))}</h1></div>${sub || c.P ? `<p class="project-deck-label"${c.t('site.projects.subtitle')}>${esc(sub)}</p>` : ''}</div><div class="deck-shell"><div class="deck-stage" role="region" aria-roledescription="${L === 'en' ? 'carousel' : 'carrusel'}" aria-label="${esc(pos)}" tabindex="0">${cards || `<article class="project-card project-card--front"><div class="project-card__image"><span class="project-card__placeholder">${L === 'en' ? 'No projects yet' : 'Sin proyectos todavía'}</span></div></article>`}<span class="sr-only" aria-live="polite" aria-atomic="true">${esc(pos)}</span></div>${controls}</div></section>`;
  }

  function aboutSection(S, L, c) {
    const A = S.about;
    const topics = visible(A.topics).map(([t, i]) => `<span${c.t('site.about.topics.' + i + '.label')}${c.it('site.about.topics.' + i)}>${esc(tx(t.label, L))}</span>`).join('');
    const fig = A.portrait ? `<figure class="portrait-figure"><div class="portrait-frame"><img alt="${esc(tx(A.portraitAlt, L))}" loading="eager" width="941" height="1672" decoding="async" data-nimg="1" data-lightbox style="color:transparent" data-web-src="${c.src(A.portrait)}"${c.e('site.about.portrait')}/><span class="portrait-corner portrait-corner--tl"></span><span class="portrait-corner portrait-corner--br"></span></div>${A.caption === false ? '' : `<figcaption><span${c.e('site.brand.text')}>${brandText(S.brand.text)}</span></figcaption>`}</figure>` : '';
    return `<section class="section about-section${A.portrait ? '' : ' web-no-figure'}" id="sobre-mi"${popupAttr(A,L)} tabindex="0" aria-labelledby="about-heading"><div class="section-head"><div><h2 id="about-heading"${c.t('site.about.title')}>${esc(tx(A.title, L))}</h2></div></div><div class="about-layout"><div class="about-copy"><p${c.t('site.about.text')}>${esc(tx(A.text, L))}</p>${topics ? `<div class="about-topics">${topics}</div>` : ''}</div>${fig}</div></section>`;

  function collabSection(S, L, c) {
    const C = S.collaborators;
    const vis = visible(C.items);
    const mv = partnerMotion(S.motion.marqueeMode, S.motion.marquee, vis.length, S.motion.intensity, S.motion.marqueeMs, S.motion.direction);

  function customSection(x, idx, L, c) {
    const base = `site.custom.${idx}`;
    const layout = x.layout || 'text';
    const eyebrow = tx(x.eyebrow, L);
    const btnLabel = tx(x.button && x.button.label, L);

    let fig = '';
    if ((layout === 'image-right' || layout === 'image-left') && x.image) fig = `<figure class="portrait-figure"><div class="portrait-frame"><img alt="${esc(tx(x.alt, L))}" loading="lazy" decoding="async" data-web-src="${c.src(x.image)}"${c.e(base + '.image')}/><span class="portrait-corner portrait-corner--tl"></span><span class="portrait-corner portrait-corner--br"></span></div></figure>`;
    let gallery = '';
    if (layout === 'gallery') gallery = `<div class="web-gallery">${(x.images || []).map((im, i) => im && im.img ? `<figure class="web-gallery__item"${c.it(base + '.images.' + i)}>${im.href ? `<a href="${esc(im.href)}" target="_blank" rel="noopener noreferrer">` : ''}<img alt="${esc(tx(im.alt, L))}" loading="lazy" decoding="async" data-web-src="${c.src(im.img)}"${c.e(base + '.images.' + i + '.img')}>${im.href ? '</a>' : ''}${tx(im.caption, L) ? `<figcaption${c.t(base + '.images.' + i + '.caption')}>${esc(tx(im.caption, L))}</figcaption>` : ''}</figure>` : '').join('')}</div>`;
    const text = tx(x.text, L);
    return `<section class="section about-section web-custom" id="${esc(x.anchor || slug(tx(x.title, 'es')) || x.id)}" data-layout="${esc(layout)}"${c.it(base)}><div class="section-head"><div>${eyebrow ? `<span class="eyebrow"${c.t(base + '.eyebrow')}>${esc(eyebrow)}</span>` : ''}<h2${c.t(base + '.title')}>${esc(tx(x.title, L))}</h2></div></div><div class="about-layout"><div class="about-copy">${text || c.P ? `<p${c.t(base + '.text')}>${esc(text)}</p>` : ''}${btn}</div>${fig}</div>${gallery}</section>`;
  }

  function siteCopy(S) {
    const out = {};
    S.i18n.locales.forEach((L) => {
      const base = JSON.parse(JSON.stringify(WEB_TPL.uiCopy[L] || WEB_TPL.uiCopy.es));
      base.metadata = { title: tx(S.meta.title, L), description: tx(S.meta.description, L) };
      base.projects.title = S.projects.visible === false ? '' : tx(S.projects.title, L); base.projects.placeholder = S.projects.visible === false ? '' : tx(S.projects.subtitle, L);
      base.about = Object.assign(base.about || {}, { title: S.about.visible === false ? '' : tx(S.about.title, L), description: S.about.visible === false ? '' : tx(S.about.text, L) });
      const slugs = { legalNotice: S.legal.slugs?.[L]?.legalNotice || (L === 'en' ? 'legal-notice' : 'aviso-legal'), privacy: S.legal.slugs?.[L]?.privacy || (L === 'en' ? 'privacy' : 'privacidad') };
      base.legalPages = {
        legalNotice: { title: tx(S.legal.legalNotice.title, L), description: '', body: tx(S.legal.legalNotice.body, L) },
        privacy: { title: tx(S.legal.privacy.title, L), description: '', body: tx(S.legal.privacy.body, L) },
        slugs
      };
      out[L] = base;
    });
    return out;
  }

  function siteOverrideCss(S, c) {
    const T = S.theme, D = WEB_TPL.siteDefaults;
    let css = '';
    css += `.project-card--stats{--stats-space:108px}.project-card--stats .project-card__image{bottom:var(--stats-space);border-bottom-left-radius:0;border-bottom-right-radius:0}.project-stats{position:absolute;inset:auto 0 0;height:var(--stats-space);display:grid;grid-template-columns:repeat(var(--stats-columns),minmax(0,1fr));align-content:center;background:var(--panel);color:var(--paper);padding:12px 8px;gap:8px 0;border-top:1px solid var(--line);box-sizing:border-box}.project-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;text-align:center;padding:0 3px}.project-stat+.project-stat{border-left:1px solid var(--line)}.project-stat svg{width:24px;height:24px;flex:none}.project-stat strong{font:600 16px/1.15 var(--font-sans);overflow-wrap:anywhere;max-width:100%}.project-stat-label{font:400 9px/1.25 var(--font-sans);overflow-wrap:anywhere;max-width:100%}.project-card--stats:has(.project-stat:nth-child(6)){--stats-space:166px}.project-stats:has(.project-stat:nth-child(6)){grid-template-columns:repeat(3,minmax(0,1fr))}.project-stat:nth-child(4){border-left:0}@media(max-width:600px){.project-card--stats{--stats-space:166px}.project-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.project-stat strong{font-size:15px}.project-stat-label{font-size:10px}}`;

  function usedAssetMap() { const used = M.usedAssets(App.state); const out = {}; Object.keys(App.assets).forEach((k) => { if (used.has(k)) out[k] = App.assets[k]; }); return out; }
  function build(kind) {
    if (kind === 'site') return { name: 'index.html', path: 'index.html', type: 'text/html;charset=utf-8', text: WEBRender.renderSite(App.state, App.assets, { mode: 'export' }) };
    if (kind === 'link') return { name: 'link-index.html', path: 'link/index.html', type: 'text/html;charset=utf-8', text: WEBRender.renderLink(App.state, App.assets, { mode: 'export' }) };
    return { name: 'proyecto-web-demo.json', path: 'proyecto-web-demo.json', type: 'application/json', text: JSON.stringify({ format: 'web-studio-project', version: 3, savedAt: new Date().toISOString(), site: App.state.site, link: App.state.link, assets: usedAssetMap() }) };
  }
  function download(f) { const url = URL.createObjectURL(new Blob([f.text], { type: f.type })); const a = h('a', { href: url, download: f.name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
  async function writeFolderFile(root, f) { const parts = String(f.path || f.name).split('/').filter(Boolean), file = parts.pop(); let dir = root; for (const part of parts) dir = await dir.getDirectoryHandle(part, { create: true }); const fh = await dir.getFileHandle(file, { create: true }); const w = await fh.createWritable(); await w.write(f.text); await w.close(); }
  async function exportAction(kind) {
    try {
      if (kind === 'folder') {
        if (!window.showDirectoryPicker) { toast('Tu navegador no permite elegir carpeta. Descargo los tres archivos.', true); kind = 'all'; }
        else {
          if (!App.dirHandle) App.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'web-export' });
          const files = [build('site'), build('link'), build('json')];
          for (const f of files) await writeFolderFile(App.dirHandle, f);
          toast(`Guardado en «${App.dirHandle.name}»: index.html, link/index.html y el proyecto`); status('Exportado a la carpeta', true); return;
        }
      }
      if (kind === 'all') { ['site', 'link', 'json'].forEach((k, i) => setTimeout(() => download(build(k)), i * 450)); toast('Descargando index.html, link-index.html y proyecto…'); return; }
      const f = build(kind); download(f); toast(`${f.name} exportado (${(f.text.length / 1048576).toFixed(1)} MB)`);
    } catch (e) { if (e && e.name === 'AbortError') return; console.error(e); toast('No se pudo exportar: ' + e.message, true); App.dirHandle = null; }
  }
  $('#importBtn').onclick = () => { const i = $('#fileImport'); i.value = ''; i.click(); };
  $('#fileImport').addEventListener('change', async () => {
    const files = [...$('#fileImport').files]; if (!files.length) return;
    for (const f of files) await importText(await f.text(), f.name);
  });
  async function importText(text, name) {
    try {
      const r = M.importAny(text, App.state, Object.assign({}, App.assets));
      beginChange();
      App.state = r.state; App.assets = r.assets;
      saveAssetsSoon(); saveSoon();
      if (r.part && r.part !== App.page) setPage(r.part); else { renderPanels(); renderPreview(); }
      toast(`${r.message} (${name})`);
    } catch (e) { console.error(e); toast(`No se pudo importar ${name}: ${e.message}`, true); }
  }
  document.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  document.addEventListener('drop', async (e) => { if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); for (const f of e.dataTransfer.files) { if (/\.(html?|json)$/i.test(f.name)) await importText(await f.text(), f.name); } });

  /* ---------- arranque ---------- */
  async function boot() {
    fitFrame(); renderPanels();
    await DB.open();
    const [saved, savedAssets] = await Promise.all([DB.get('state'), DB.get('assets')]);
    if (saved && saved.state) {
      try {
        App.state = M.normalize(saved.state);
        if (savedAssets) App.assets = Object.assign({}, DEFAULT.assets, savedAssets);
        App.theme = App.state.site.theme.default || 'light';
        toast('Borrador recuperado · ' + new Date(saved.at).toLocaleString());
      } catch (e) { console.warn(e); }
    } else DB.put('assets', App.assets);
    syncSeg('#themeSeg', 'th', App.theme);
    renderPanels(); renderPreview();
    status('Listo · haz clic en cualquier elemento de la vista previa para editarlo', true);
  }
  window.WEBEditor = { App, renderPreview, change, getP, setP, exportBuild: build, importText, setPage };
  boot();
})();
</script>
</body>
</html>
